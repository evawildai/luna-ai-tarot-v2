server {
    listen 80;
    server_name luna.example.com;
    root /opt/luna-ai-py/static;

    location /api/ { proxy_pass http://127.0.0.1:8000; }
    location /telegram/webhook { proxy_pass http://127.0.0.1:8000; }
    location /static/ { alias /opt/luna-ai-py/static/; expires 7d; }

    location = /          { try_files /index.html =404; }
    location = /today     { try_files /today.html =404; }
    location = /spreads   { try_files /spreads.html =404; }
    location = /mac       { try_files /mac.html =404; }
    location = /natal     { try_files /natal.html =404; }
    location = /journal   { try_files /journal.html =404; }
    location = /profile   { try_files /profile.html =404; }
    location = /policy    { try_files /policy.html =404; }
}
# HTTPS добавит certbot --nginx (deploy.sh): 443 ssl + редирект 80->443.
