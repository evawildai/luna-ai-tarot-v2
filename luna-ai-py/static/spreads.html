<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Расклады — LUNA AI</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/luna.css" />
</head>
<body>
  <main style="margin-top: 4vh">
    <section class="luna-card">
      <p class="text-xs tracking-widest uppercase luna-accent">Расклады</p>
      <h1 class="luna-title text-xl mt-1 mb-4">Выберите схему</h1>
      <div id="spreads" class="space-y-3"></div>

      <div class="mt-5">
        <label class="block text-xs text-[#8a8a9a] mb-1" for="question">Ваш вопрос (необязательно)</label>
        <input class="luna-input" type="text" id="question" placeholder="На что мне обратить внимание сейчас?" />
      </div>
      <button class="luna-btn w-full mt-4" id="draw-btn" disabled>Вытянуть карты</button>
      <p id="error" class="text-sm text-red-400 hidden mt-2"></p>
    </section>

    <section id="result" class="hidden"></section>
  </main>

  <script src="/static/js/tg.js"></script>
  <script src="/static/js/luna.js"></script>
  <script>
    let spreads = [];
    let selected = null;

    async function loadSpreads() {
      const res = await fetch('/api/meta');
      const meta = await res.json();
      spreads = meta.spreads;
      const box = document.getElementById('spreads');
      box.innerHTML = '';
      spreads.forEach(s => {
        const el = document.createElement('button');
        el.className = 'w-full text-left luna-card !mb-0 !p-4 border transition';
        el.style.borderColor = 'rgba(139,92,246,0.25)';
        el.innerHTML = `<p class="luna-title text-sm">${s.title}</p>
          <p class="text-xs text-[#8a8a9a] mt-1">${s.description}</p>
          <p class="text-xs luna-accent mt-1">${s.cardCount} ${s.cardCount === 1 ? 'карта' : 'карты'} · ${s.recommendedFor}</p>`;
        el.addEventListener('click', () => {
          selected = s;
          [...box.children].forEach(c => c.style.borderColor = 'rgba(139,92,246,0.25)');
          el.style.borderColor = '#a78bfa';
          document.getElementById('draw-btn').disabled = false;
        });
        box.appendChild(el);
      });
    }

    document.getElementById('draw-btn').addEventListener('click', async () => {
      if (!selected) return;
      const btn = document.getElementById('draw-btn');
      const err = document.getElementById('error');
      err.classList.add('hidden');
      btn.disabled = true;
      try {
        const res = await fetch('/api/reading', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...window.lunaHeaders() },
          body: JSON.stringify({ spread_id: selected.id, question: document.getElementById('question').value || null }),
        });
        const body = await res.json();
        if (!res.ok) throw new Error(body.detail || 'Ошибка расклада');
        await ritual(body);
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.remove('hidden');
      } finally {
        btn.disabled = false;
      }
    });

    // --- Ритуал: карты выходят рубашками по одной, каждая открывается по тапу ---
    const GLYPHS = ['✦', '☾', '✧', '☽', '✶', '⚹'];

    function ritualCardHTML(p, i) {
      const name = p.card.title || p.card.nameRu;
      return `
        <div class="ritual-card__inner">
          <div class="ritual-card__face ritual-card__back"><span class="spiral" aria-hidden="true"></span></div>
          <div class="ritual-card__face ritual-card__front">
            <span class="ritual-card__glyph" aria-hidden="true">${GLYPHS[i % GLYPHS.length]}</span>
            <span class="ritual-card__name">${name}</span>
            ${p.card.reversed ? '<span class="ritual-card__rev">↺ перевёрнутая</span>' : ''}
          </div>
        </div>`;
    }

    function ritual(reading) {
      return new Promise((resolve) => {
        const backdrop = document.createElement('div');
        backdrop.className = 'ritual-backdrop';
        backdrop.id = 'ritual';
        backdrop.innerHTML = `
          <p class="ritual-title" id="ritual-status">Луна тасует колоду…</p>
          <div class="ritual-row" id="ritual-row"></div>
          <button class="luna-btn luna-btn--ghost !py-1.5 !px-4 text-sm" id="ritual-skip">Пропустить</button>`;
        document.body.appendChild(backdrop);
        const row = backdrop.querySelector('#ritual-row');
        const skip = backdrop.querySelector('#ritual-skip');
        const cards = () => [...row.querySelectorAll('.ritual-card')];

        const finish = () => {
          backdrop.remove();
          render(reading);
          resolve();
        };
        skip.addEventListener('click', () => {
          cards().forEach(c => { c.classList.add('is-dealt', 'is-flipped'); c.onclick = null; });
          setTimeout(finish, 650);
        }, { once: true });

        reading.positions.forEach((p, i) => {
          const el = document.createElement('div');
          el.className = 'ritual-card';
          el.setAttribute('role', 'button');
          el.setAttribute('aria-label', 'Карта ' + (i + 1) + ' — открыть');
          el.innerHTML = ritualCardHTML(p, i);
          row.appendChild(el);
          // выход карты из колоды: интервал ~0,6 с, с тасовкой/свечением
          setTimeout(() => {
            el.classList.add('is-dealt', 'is-shuffling');
            setTimeout(() => el.classList.remove('is-shuffling'), 500);
            backdrop.querySelector('#ritual-status').textContent = 'Коснитесь карты, чтобы открыть';
          }, 300 + i * 600);

          el.addEventListener('click', () => {
            if (el.classList.contains('is-flipped')) return;
            el.classList.add('is-flipped');
            if (cards().every(c => c.classList.contains('is-flipped'))) {
              setTimeout(finish, 900);
            }
          });
        });
      });
    }

    function render(r) {
      const box = document.getElementById('result');
      box.classList.remove('hidden');
      const cards = r.positions.map(p => `
        <div class="luna-card">
          <p class="text-xs tracking-widest uppercase luna-accent">${p.position_title}</p>
          <p class="luna-title text-lg mt-1">${p.card.title || p.card.nameRu}
            <span class="text-xs text-[#8a8a9a]">${p.card.reversed ? '↺ перевёрнутая' : ''}</span></p>
          <p class="text-xs luna-accent mt-1">${(p.card.keywords || []).join(' · ')}</p>
          <p class="text-sm mt-2">${p.meaning}</p>
          <p class="text-xs text-[#8a8a9a] mt-2">💡 ${p.position_hint}</p>
        </div>`).join('');
      box.innerHTML = `
        <div class="luna-card">
          <p class="text-xs tracking-widest uppercase luna-accent">Результат</p>
          <h2 class="luna-title text-lg mt-1">${r.spread.title}</h2>
          ${r.question ? `<p class="text-sm text-[#8a8a9a] mt-1">Вопрос: «${r.question}»</p>` : ''}
          <div class="flex gap-2 mt-3">
            <button class="luna-btn luna-btn--ghost !py-1.5 !px-4 text-sm" id="back-to-list">← К раскладам</button>
            <button class="luna-btn !py-1.5 !px-4 text-sm" id="new-reading">Новый расклад</button>
          </div>
        </div>
        ${cards}`;
      box.scrollIntoView({ behavior: 'smooth' });
      document.getElementById('back-to-list').addEventListener('click', () => {
        document.getElementById('spreads').closest('.luna-card').scrollIntoView({ behavior: 'smooth' });
      });
      document.getElementById('new-reading').addEventListener('click', () => {
        box.classList.add('hidden');
        box.innerHTML = '';
        document.getElementById('draw-btn').disabled = !selected;
        document.getElementById('spreads').closest('.luna-card').scrollIntoView({ behavior: 'smooth' });
      });
    }

    loadSpreads().catch(() => {});
  </script>
</body>
</html>
